<!doctype html>
<!--
  Картинка-превью для соцсетей и мессенджеров: public/og-image.jpg (1200×630).
  Шрифты и цвета — как на сайте (Playfair Display + Inter, токены из app/globals.css).
  Логотип и важный текст держим в полосе y 47…583: ВКонтакте обрезает превью до 2,24:1.

  Перерисовать (Windows, Git Bash, из корня проекта; нужен интернет для шрифтов Google):
    D="$(pwd -W)/design/og-image"
    "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --hide-scrollbars \
      --user-data-dir="$TEMP/og-chrome" --force-device-scale-factor=2 --window-size=1200,630 \
      --virtual-time-budget=10000 --screenshot="$TEMP/og@2x.png" "file:///$D/og-image.html"
    node -e "require('sharp')(process.env.TEMP+'/og@2x.png').resize(1200,630,{kernel:'lanczos3'})
      .jpeg({quality:88,mozjpeg:true,chromaSubsampling:'4:4:4'}).toFile('public/og-image.jpg')"
-->
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Playfair+Display:ital,wght@0,700;1,500&display=block" rel="stylesheet">
<style>
:root{
  --cream:oklch(0.974 0.012 85); --cream-deep:oklch(0.945 0.022 85);
  --gold:oklch(0.735 0.135 78); --gold-deep:oklch(0.600 0.130 72);
  --charcoal:oklch(0.190 0.008 60); --mute:oklch(0.440 0.015 60);
}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;color:var(--charcoal);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(ellipse 560px 520px at 304px 315px, oklch(0.993 0.006 85) 0%, var(--cream) 55%, var(--cream-deep) 100%)}
/* logo-round.webp: сверху 66 px прозрачного поля, рисунок 1740×1934 → показываем рисунок высотой 490 с y=70 */
.logo{position:absolute;left:84px;top:53.3px;height:506.7px}
.text{position:absolute;left:604px;top:0;bottom:0;width:516px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font:600 17px/1 Inter;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:24px;display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:36px;height:2px;background:var(--gold)}
h1{font:700 64px/1.02 'Playfair Display',serif;margin:0;letter-spacing:-.005em}
h1 em{display:block;font:italic 500 38px/1.2 'Playfair Display',serif;color:var(--gold-deep);margin-top:10px}
.rule{width:64px;height:3px;background:var(--gold);margin:30px 0 26px;border-radius:2px}
p{font:500 25px/1.4 Inter;color:var(--mute);margin:0}
.url{margin-top:24px;font:600 23px/1 Inter;letter-spacing:.03em}
</style></head><body>
<img class="logo" src="logo-round.webp" alt="">
<div class="text">
  <div class="eyebrow">Сыроварня в Томске</div>
  <h1>Крафтовые сыры<em>собственного производства</em></h1>
  <div class="rule"></div>
  <p>Доставка по Томску, самовывоз,<br>подарочные сертификаты</p>
  <div class="url">fourkings.ru</div>
</div>
</body></html>
