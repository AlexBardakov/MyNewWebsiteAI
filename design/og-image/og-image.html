<!doctype html>
<!--
  Картинка-превью для соцсетей и мессенджеров: public/og-image.jpg (1200×630).
  Шрифт текста — Century Schoolbook: тот же, которым в логотипе набрано «семейная сыроварня».
  На картинке всего две гарнитуры: шрифт «FOUR KINGS» (часть логотипа) и Century.
  Шрифты берутся из Windows (ставятся с Microsoft Office): SCHLBKB.TTF и CENTURY.TTF.
  Цвета — токены бренда из app/globals.css.
  Логотип и текст держим в полосе y 47…583: ВКонтакте обрезает превью до 2,24:1.

  Перерисовать (Windows, Git Bash, из корня проекта):
    D="$(pwd -W)/design/og-image"
    "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --hide-scrollbars \
      --user-data-dir="$TEMP/og-chrome" --force-device-scale-factor=2 --window-size=1200,630 \
      --virtual-time-budget=5000 --screenshot="$TEMP/og@2x.png" "file:///$D/og-image.html"
    node -e "require('sharp')(process.env.TEMP+'/og@2x.png').resize(1200,630,{kernel:'lanczos3'})
      .jpeg({quality:88,mozjpeg:true,chromaSubsampling:'4:4:4'}).toFile('public/og-image.jpg')"
-->
<html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Schoolbook";src:url("file:///C:/Windows/Fonts/SCHLBKB.TTF");font-weight:700}
@font-face{font-family:"Schoolbook";src:url("file:///C:/Windows/Fonts/CENTURY.TTF");font-weight:400}
:root{
  --cream:oklch(0.974 0.012 85); --cream-deep:oklch(0.945 0.022 85);
  --gold:oklch(0.735 0.135 78); --gold-deep:oklch(0.600 0.130 72);
  --ink:#1e0e00;                  /* цвет надписей логотипа */
  --body:oklch(0.360 0.015 60);
}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;color:var(--ink);font-family:Schoolbook,serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(ellipse 560px 520px at 304px 315px, oklch(0.993 0.006 85) 0%, var(--cream) 55%, var(--cream-deep) 100%)}
/* logo-round.webp: сверху 66 px прозрачного поля, рисунок 1740×1934 → показываем рисунок высотой 490 с y=70 */
.logo{position:absolute;left:84px;top:53.3px;height:506.7px}
.text{position:absolute;left:604px;top:0;bottom:0;width:530px;display:flex;flex-direction:column;justify-content:center}
h1{font-weight:700;font-size:62px;line-height:1.06;margin:0}
.sub{font-weight:700;font-size:33px;line-height:1.2;color:var(--gold-deep);margin-top:12px}
.rule{width:64px;height:3px;background:var(--gold);border-radius:2px;margin:30px 0 26px}
p{font-weight:400;font-size:26px;line-height:1.4;color:var(--body);margin:0}
.url{margin-top:22px;font-weight:700;font-size:24px;line-height:1}
</style></head><body>
<img class="logo" src="logo-round.webp" alt="">
<div class="text">
  <h1>Крафтовые сыры</h1>
  <div class="sub">собственного производства</div>
  <div class="rule"></div>
  <p>Доставка по Томску, самовывоз,<br>подарочные сертификаты</p>
  <div class="url">fourkings.ru</div>
</div>
</body></html>
